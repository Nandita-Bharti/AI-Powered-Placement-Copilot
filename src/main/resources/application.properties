spring.application.name=placement-copilot

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/placement_copilot_db
spring.datasource.username=postgres
spring.datasource.password=post@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.3